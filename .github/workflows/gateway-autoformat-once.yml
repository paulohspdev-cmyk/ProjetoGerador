name: Gateway Autoformat Once

on:
  push:
    branches:
      - feat/gateway-umbrella-foundation

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/gateway-umbrella-foundation
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Format Gateway
        run: |
          find gateway-umbrella -name '*.go' -type f -print0 | xargs -0 gofmt -w
          printf '\n- Autoformat Go aplicado ao checkpoint TLS/mTLS/Unix antes da validacao completa de CI.\n' >> gateway-umbrella/docs/PROJECT_STATE.md
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gateway-umbrella
          git commit -m 'style(gateway): aplica gofmt no checkpoint TLS Unix'
          git push origin HEAD:feat/gateway-umbrella-foundation
