name: Gateway Umbrella Maintenance Temp

on:
  push:
    branches:
      - feat/gateway-umbrella-foundation

permissions:
  contents: write

jobs:
  maintain:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/gateway-umbrella-foundation
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Format and tidy Gateway
        run: |
          set -euo pipefail
          find gateway-umbrella -type f -name '*.go' -print0 | xargs -0 gofmt -w
          (cd gateway-umbrella/adapters && go mod tidy && go mod verify)
          if git diff --quiet -- gateway-umbrella; then
            exit 0
          fi
          git diff --check -- gateway-umbrella
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gateway-umbrella
          git commit -m 'build(gateway): normalize modules and formatting'
          git push origin HEAD:feat/gateway-umbrella-foundation
