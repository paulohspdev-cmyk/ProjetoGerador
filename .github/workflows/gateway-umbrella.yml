name: Gateway Umbrella

on:
  push:
    branches:
      - 'feat/gateway-umbrella-*'
    paths:
      - 'gateway-umbrella/**'
      - '.github/workflows/gateway-umbrella.yml'
  pull_request:
    paths:
      - 'gateway-umbrella/**'
      - '.github/workflows/gateway-umbrella.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handoff:
    name: Canonical project state
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require PROJECT_STATE update
        run: bash gateway-umbrella/scripts/check-project-state-updated.sh

  bridge:
    name: Bridge Core Go
    needs: handoff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: gateway-umbrella/go.mod
      - name: Format
        working-directory: gateway-umbrella
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: gateway-umbrella
        run: go vet ./...
      - name: Unit and socket integration tests
        working-directory: gateway-umbrella
        run: go test ./... -count=1
      - name: Kernel vcan integration when available
        working-directory: gateway-umbrella
        run: |
          if sudo modprobe vcan 2>/dev/null && sudo ip link add dev vcan0 type vcan 2>/dev/null; then
            sudo ip link set dev vcan0 mtu 72 || true
            sudo ip link set dev vcan0 up
            RC_GATEWAY_TEST_VCAN=1 go test ./internal/provider/canbridge -run TestVCANRoundTripClassicAndFD -count=1
          else
            echo "::notice::Hosted runner kernel has no vcan support; kernel CAN round-trip remains an explicit VM/HIL gate."
          fi
      - name: Race detector
        working-directory: gateway-umbrella
        run: go test -race ./... -count=1
      - name: Build
        working-directory: gateway-umbrella
        run: go build ./cmd/rc-gateway

  stress:
    name: Stress and leak gate
    needs: bridge
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: gateway-umbrella/go.mod
      - name: 1000 concurrent pairs and 1000 TCP churn cycles
        working-directory: gateway-umbrella
        env:
          RC_GATEWAY_STRESS: '1'
          RC_GATEWAY_STRESS_PAIRS: '1000'
          RC_GATEWAY_CHURN_CYCLES: '1000'
        run: go test ./internal/bridge -run '^TestStress' -count=1 -timeout=12m

  soak:
    name: Impairment and mini-soak gate
    needs: stress
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache-dependency-path: gateway-umbrella/go.mod
      - name: Repeated impaired reconnect soak
        working-directory: gateway-umbrella
        env:
          RC_GATEWAY_SOAK: '1'
          RC_GATEWAY_SOAK_SECONDS: '20'
        run: go test ./internal/bridge -run '^TestSoakImpairedReconnect$' -count=1 -timeout=2m
