name: Gateway Tidy Serial

on:
  push:
    branches:
      - feat/gateway-umbrella-foundation

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/gateway-umbrella-foundation
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
      - name: Tidy module
        working-directory: gateway-umbrella
        run: go mod tidy
      - name: Update handoff
        run: printf '\n- `go mod tidy` aplicado ao checkpoint Serial com Go 1.27.1.\n' >> gateway-umbrella/docs/PROJECT_STATE.md
      - name: Commit tidy
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add gateway-umbrella/go.mod gateway-umbrella/go.sum gateway-umbrella/docs/PROJECT_STATE.md
          git commit -m 'build(gateway): normaliza modulo do provider serial'
          git push origin HEAD:feat/gateway-umbrella-foundation
