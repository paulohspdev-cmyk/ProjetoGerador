name: Temp Format PR35

on:
  pull_request:
    branches:
      - fix/restaura-paleta-cards-industriais

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'fix/reconstrucao-produto-ux-profissional'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout head do PR
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Dependências
        run: npm ci --include=dev

      - name: Aplicar Prettier canônico
        run: npx prettier --write src scripts

      - name: Commitar somente formatação
        run: |
          if git diff --quiet -- src scripts; then
            echo 'Nenhuma formatação pendente.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts
          git commit -m 'style: aplicar formatação canônica do frontend'
          git push origin HEAD:fix/reconstrucao-produto-ux-profissional
