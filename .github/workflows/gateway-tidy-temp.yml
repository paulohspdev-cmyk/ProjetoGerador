name: Gateway Umbrella Tidy Temp

on:
  push:
    branches:
      - feat/gateway-umbrella-foundation

permissions:
  contents: write

jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat/gateway-umbrella-foundation
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.1'
          cache: false
      - name: Tidy adapter dependencies
        working-directory: gateway-umbrella/adapters
        run: |
          set -euo pipefail
          go mod tidy
          go mod verify
          if git diff --quiet -- go.mod go.sum; then
            echo 'No module changes required.'
            exit 0
          fi
          git diff --check -- go.mod go.sum
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add go.mod go.sum
          git commit -m 'build(gateway): record adapter module checksums'
          git push origin HEAD:feat/gateway-umbrella-foundation
