name: One-shot architecture refactor (manual only)

# Ferramenta histórica de refatoração. Mantida apenas para execução manual consciente;
# nunca deve reescrever a branch automaticamente em resposta a push.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/fechamento-funcional-pre-vm
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Split oversized business components
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('src/components/scada')

          # Controllers: move catalog/model helpers out of the screen.
          path = root / 'ControllersV3Screen.tsx'
          src = path.read_text()
          start = src.index('type CatalogController =')
          end = src.index('export function ControllersV3Screen()')
          model = src[start:end]
          model = model.replace('type CatalogController =', 'export type CatalogController =', 1)
          model = model.replace('type LibraryWithCatalog =', 'export type LibraryWithCatalog =', 1)
          model = model.replace('const applicationKind:', 'export const applicationKind:', 1)
          model = model.replace('const emptyTopology:', 'export const emptyTopology:', 1)
          model = 'import type { AssetKind, TopologyV3 } from "@/lib/domain-api";\n\n' + model
          (root / 'ControllersV3Model.ts').write_text(model)
          src = src[:start] + 'import { applicationKind, emptyTopology, type CatalogController, type LibraryWithCatalog } from "./ControllersV3Model";\n\n' + src[end:]
          src = src.replace('import { domainApi, type AssetKind, type TopologyV3 } from "@/lib/domain-api";', 'import { domainApi, type TopologyV3 } from "@/lib/domain-api";')
          grouped_old = '''  const grouped = useMemo(() => {\n    const map = new Map<string, CatalogController[]>();\n    for (const item of catalog) {\n      const key = `${item.manufacturer} — ${item.family || "Outros"}`;\n      const bucket = map.get(key) ?? [];\n      bucket.push(item);\n      map.set(key, bucket);\n    }\n    return [...map.entries()];\n  }, [catalog]);\n'''
          grouped_new = '  const grouped = useMemo(() => groupCatalog(catalog), [catalog]);\n'
          if grouped_old in src:
              src = src.replace(grouped_old, grouped_new, 1)
              with (root / 'ControllersV3Model.ts').open('a') as f:
                  f.write('''\nexport function groupCatalog(catalog: CatalogController[]) {\n  const map = new Map<string, CatalogController[]>();\n  for (const item of catalog) {\n    const key = `${item.manufacturer} — ${item.family || "Outros"}`;\n    const bucket = map.get(key) ?? [];\n    bucket.push(item);\n    map.set(key, bucket);\n  }\n  return [...map.entries()];\n}\n''')
              src = src.replace('applicationKind, emptyTopology, type CatalogController, type LibraryWithCatalog', 'applicationKind, emptyTopology, groupCatalog, type CatalogController, type LibraryWithCatalog', 1)
          path.write_text(src)

          # Management: extract ClientsScreen into its own module.
          path = root / 'mgmt.tsx'
          src = path.read_text()
          start = src.index('export function ClientsScreen()')
          end = src.index('export function UnitsScreen()')
          body = src[start:end]
          header = '''import { Users } from "lucide-react";\nimport { type FormEvent, useEffect, useState } from "react";\n\nimport { useAuth } from "@/components/auth/AuthProvider";\nimport { rcApi, type OpsClient } from "@/lib/api";\nimport { ActionBtn, Panel, ScadaTable, ScreenBody, Stats, Tone } from "./kit";\n\nfunction ErrorBox({ message }: { message: string }) {\n  if (!message) return null;\n  return <p className="rounded-md border border-offline/40 bg-offline/10 p-3 text-sm text-offline">{message}</p>;\n}\n\nfunction ConfirmButton({ label, onConfirm, disabled }: { label: string; onConfirm: () => void; disabled?: boolean }) {\n  return <ActionBtn tone="danger" disabled={disabled} onClick={onConfirm}>{label}</ActionBtn>;\n}\n\n'''
          (root / 'ClientsScreen.tsx').write_text(header + body)
          src = src[:start] + 'export { ClientsScreen } from "./ClientsScreen";\n\n' + src[end:]
          src = src.replace('import { Building2, Users, Webhook } from "lucide-react";', 'import { Building2, Webhook } from "lucide-react";')
          path.write_text(src)

          # Industrial operations: extract maintenance lifecycle screen.
          path = root / 'IndustrialOpsScreens.tsx'
          src = path.read_text()
          start = src.index('export function MaintenanceV3Screen()')
          end = src.index('export function EscalationV3Screen()')
          body = src[start:end]
          header = '''import { type FormEvent, useEffect, useMemo, useState } from "react";\nimport { AlertTriangle, CalendarClock, Wrench } from "lucide-react";\n\nimport { useAuth } from "@/components/auth/AuthProvider";\nimport { useGenerators } from "@/components/generators/GeneratorsProvider";\nimport { industrialApi, type MaintenancePlan } from "@/lib/industrial-api";\nimport { useScadaOps } from "./ScadaOpsProvider";\nimport { ActionBtn, Panel, Pill, ScadaTable, ScreenBody, Stats } from "./kit";\n\nfunction dt(epoch?: number | null) {\n  return epoch ? new Date(epoch * 1000).toLocaleString("pt-BR") : "—";\n}\n\n'''
          (root / 'MaintenanceV3Screen.tsx').write_text(header + body)
          src = src[:start] + 'export { MaintenanceV3Screen } from "./MaintenanceV3Screen";\n\n' + src[end:]
          src = src.replace('  type MaintenancePlan,\n', '')
          src = src.replace('import { useScadaOps } from "./ScadaOpsProvider";\n', '')
          path.write_text(src)

          # Operations: extract the overview screen; keep shared helpers for remaining screens.
          path = root / 'operations.tsx'
          src = path.read_text()
          start = src.index('export function OperationCenter()')
          end = src.index('export function SitesScreen()')
          body = src[start:end]
          header = '''import { useMemo } from "react";\nimport { BellRing, Gauge, Radio, Server } from "lucide-react";\n\nimport { StatusPill } from "@/components/generators/StatusPill";\nimport { useGenerators } from "@/components/generators/GeneratorsProvider";\nimport type { Generator } from "@/data/generators";\nimport { useScadaOps } from "./ScadaOpsProvider";\nimport { Panel, Pill, ScreenBody, Stats } from "./kit";\n\nfunction fmt(n: number, d = 1) {\n  return Number.isFinite(n) ? n.toFixed(d).replace(".", ",") : "N/D";\n}\n\nfunction hasMetric(g: Generator, key: string) {\n  return (g.availableMetrics ?? []).includes(key);\n}\n\ntype LiveAlarm = { id: string; gen: string; site: string; severity: "falha" | "alarme" | "aviso"; message: string; since: string; ack: boolean };\n\nfunction realAlarms(generators: Generator[], isAcked: (id: string, seed: boolean) => boolean): LiveAlarm[] {\n  return generators.flatMap((g) => {\n    const rows: Omit<LiveAlarm, "ack">[] = [];\n    if (g.status === "offline") {\n      rows.push({ id: `COMM-${g.id}`, gen: g.tag, site: g.site, severity: "falha", message: g.lastError?.trim() || "Comunicação/telemetria indisponível", since: "estado atual" });\n    } else if (g.status === "alerta") {\n      rows.push({ id: `SCADA-${g.id}`, gen: g.tag, site: g.site, severity: "alarme", message: g.lastError?.trim() || "Controlador reporta estado de alerta; causa específica N/D", since: "estado atual" });\n    }\n    return rows.map((row) => ({ ...row, ack: isAcked(row.id, false) }));\n  });\n}\n\n'''
          (root / 'OperationCenter.tsx').write_text(header + body)
          src = src[:start] + 'export { OperationCenter } from "./OperationCenter";\n\n' + src[end:]
          # Drop imports that became unique to the extracted screen when no longer referenced.
          for name in ['Server', 'StatusPill']:
              if len(re.findall(rf'\\b{name}\\b', src)) == 1:
                  if name == 'StatusPill':
                      src = src.replace('import { StatusPill } from "@/components/generators/StatusPill";\n', '')
                  else:
                      src = src.replace('BellRing, Gauge, MapPin, Radio, Server', 'BellRing, Gauge, MapPin, Radio')
          path.write_text(src)
          PY
      - name: Format refactor
        run: npx prettier --write src/components/scada/ControllersV3Screen.tsx src/components/scada/ControllersV3Model.ts src/components/scada/mgmt.tsx src/components/scada/ClientsScreen.tsx src/components/scada/IndustrialOpsScreens.tsx src/components/scada/MaintenanceV3Screen.tsx src/components/scada/operations.tsx src/components/scada/OperationCenter.tsx
      - name: Architecture
        run: npm run check:architecture
      - name: ESLint
        run: npm run lint
      - name: Commit validated refactor
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/components/scada/ControllersV3Screen.tsx src/components/scada/ControllersV3Model.ts src/components/scada/mgmt.tsx src/components/scada/ClientsScreen.tsx src/components/scada/IndustrialOpsScreens.tsx src/components/scada/MaintenanceV3Screen.tsx src/components/scada/operations.tsx src/components/scada/OperationCenter.tsx
          git commit -m "refactor: split oversized scada screens"
          git push origin HEAD:fix/fechamento-funcional-pre-vm
