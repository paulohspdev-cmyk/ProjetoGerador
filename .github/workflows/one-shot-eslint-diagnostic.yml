name: One-shot Prettier cleanup

on:
  push:
    branches:
      - fix/fechamento-funcional-pre-vm
    paths:
      - .github/workflows/one-shot-eslint-diagnostic.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/fechamento-funcional-pre-vm
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Normalize repository with locked Prettier
        run: npx prettier --write .

      - name: Preserve workflows and commit formatting
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore --source=HEAD -- .github/workflows
          git rm -f .eslint-current.log
          git add -A
          git commit -m "fix: normalize repository prettier formatting"
          git push origin HEAD:fix/fechamento-funcional-pre-vm
