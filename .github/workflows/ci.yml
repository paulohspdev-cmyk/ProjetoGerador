name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Frontend dependencies
        run: npm ci

      - name: Frontend build para VM
        env:
          NITRO_PRESET: node-server
        run: npm run build

      - name: Frontend Node smoke test
        run: |
          set -euo pipefail
          test -f .output/server/index.mjs
          PORT=3000 HOST=127.0.0.1 node .output/server/index.mjs > /tmp/frontend.log 2>&1 &
          PID=$!
          trap 'kill $PID 2>/dev/null || true' EXIT
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/frontend.log
          exit 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install 'httpx>=0.27,<1'

      - name: Backend syntax
        run: python -m compileall -q backend/app backend/tests rapid/provisioning

      - name: Backend import
        working-directory: backend
        env:
          RC_DATA_DIR: ${{ runner.temp }}/rc-geradores-import
        run: python -c "from app.main import app; print(app.title, app.version)"

      - name: Backend auth RBAC smoke
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python tests/smoke.py

      - name: Instaladores Bash
        run: |
          bash -n ops/install.sh
          bash -n ops/status.sh
          bash -n rapid/provisioning/provision_ig200.sh
