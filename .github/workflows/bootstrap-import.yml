name: Bootstrap frontend import

on:
  push:
    paths:
      - '.github/workflows/bootstrap-import.yml'
      - 'generator-vision-main.zip'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar e extrair frontend enviado
        run: |
          set -euo pipefail
          test -f generator-vision-main.zip
          echo "ZIP_BYTES=$(wc -c < generator-vision-main.zip)"
          sha256sum generator-vision-main.zip
          unzip -tq generator-vision-main.zip

          rm -rf /tmp/generator-import
          mkdir -p /tmp/generator-import
          unzip -q generator-vision-main.zip -d /tmp/generator-import

          SOURCE=/tmp/generator-import/generator-vision-main
          test -f "$SOURCE/package.json"
          test -f "$SOURCE/package-lock.json"
          test -d "$SOURCE/src"
          test -d "$SOURCE/public"

          echo "Arquivos fonte:"
          find "$SOURCE" -type f \
            -not -path '*/node_modules/*' \
            -not -path '*/.tanstack/*' | wc -l

      - name: Instalar dependências e validar build
        working-directory: /tmp/generator-import/generator-vision-main
        run: |
          set -euo pipefail
          rm -rf node_modules
          npm ci
          npm run build

      - name: Importar somente código-fonte
        run: |
          set -euo pipefail
          SOURCE=/tmp/generator-import/generator-vision-main/
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='.tanstack/' \
            --exclude='dist/' \
            --exclude='.output/' \
            --exclude='.vinxi/' \
            --exclude='.wrangler/' \
            "$SOURCE" ./

          rm -f generator-vision-main.zip
          rm -f .github/workflows/bootstrap-import.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          test -f package.json
          test -f package-lock.json
          test -d src
          test -d public
          test ! -d node_modules

      - name: Commit frontend validado
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "feat: importa frontend completo Generator Vision"
          git push origin HEAD:main
