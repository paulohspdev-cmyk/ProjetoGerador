name: Bootstrap frontend import

on:
  issues:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write
  issues: read

jobs:
  import-frontend:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.number == 1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild uploaded frontend package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/1/comments" --jq '.[] | .body' \
            | tr -d '\r\n\t ' > /tmp/generator-vision.b64
          base64 --decode /tmp/generator-vision.b64 > /tmp/generator-vision.zip
          unzip -tq /tmp/generator-vision.zip
          rm -rf /tmp/generator-vision
          mkdir -p /tmp/generator-vision
          unzip -q /tmp/generator-vision.zip -d /tmp/generator-vision
          test -f /tmp/generator-vision/package.json
          test -f /tmp/generator-vision/package-lock.json
          test -d /tmp/generator-vision/src
          test -d /tmp/generator-vision/public
          rsync -a /tmp/generator-vision/ ./
          rm -f .github/workflows/bootstrap-import.yml

      - name: Commit imported frontend
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: importa frontend completo Generator Vision"
          git push origin HEAD:main
